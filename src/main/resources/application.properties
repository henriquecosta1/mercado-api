# Conexão com o PostgreSQL do Docker
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/mercado_db
quarkus.datasource.username=postgres
quarkus.datasource.password=postgrespassword

# Migrations automáticas via Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.hibernate-orm.database.generation=none

# CORS liberado para o Vite (React)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,http://localhost,https://localhost
%dev.quarkus.http.cors.origins=/https?:\\/\\/(localhost|127\\.0\\.0\\.1)(:[0-9]+)?/
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,x-tenant-id,X-Tenant-Id
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true
