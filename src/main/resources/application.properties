# =====================================================================
# Servidor HTTP / Railway
# =====================================================================
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}

# =====================================================================
# Conexão com o PostgreSQL do Docker / Railway
# =====================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:mercado_pdv}
quarkus.datasource.username=${PGUSER:postgres}
quarkus.datasource.password=${PGPASSWORD:postgres}

# Migrations automáticas via Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.hibernate-orm.database.generation=none

# =====================================================================
# CORS para integração com React
# =====================================================================
quarkus.http.cors=true
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://mercadopdv.up.railway.app,http://localhost:5173
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,x-tenant-id,X-Tenant-Id,x-gerente-pin,X-Gerente-Pin,x-admin-key,X-Admin-Key
quarkus.http.cors.exposed-headers=Authorization,Content-Disposition,X-Tenant-Id
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# =====================================================================
# Serialização JSON (ISO-8601 para datas no frontend)
# =====================================================================
quarkus.jackson.write-dates-as-timestamps=false

# Chave secreta de administração para ativação de licenças de tenants
mercado.admin.secret-key=admin123

# =====================================================================
# SmallRye JWT / MicroProfile JWT - Autenticação
# =====================================================================
mp.jwt.verify.issuer=mercado-api

# Política de segurança (permissiva nas rotas públicas, restrita por anotações no código)
quarkus.http.auth.permission.health.paths=/api/health,/health
quarkus.http.auth.permission.health.policy=permit
quarkus.http.auth.permission.default.paths=/*
quarkus.http.auth.permission.default.policy=permit

# Configurao Local (Perfil Dev)
%dev.smallrye.jwt.sign.key.location=/privateKey.pem
%dev.mp.jwt.verify.publickey.location=/publicKey.pem

quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.enable-forwarded-prefix=true
quarkus.http.proxy.proxy-address-forwarding=true


%test.smallrye.jwt.sign.key.location=/privateKey.pem

