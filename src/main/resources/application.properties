# Conexão com o PostgreSQL do Docker / Railway
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:mercado_pdv}
quarkus.datasource.username=${PGUSER:postgres}
quarkus.datasource.password=${PGPASSWORD:postgres}

# Migrations automáticas via Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.hibernate-orm.database.generation=none

# CORS liberado para o frontend em produção
quarkus.http.cors=true
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,x-tenant-id,X-Tenant-Id,x-gerente-pin,X-Gerente-Pin,x-admin-key,X-Admin-Key
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

# Chave secreta de administração para ativação de licenças de tenants
mercado.admin.secret-key=admin123

# =====================================================================
# SmallRye JWT / MicroProfile JWT - Autenticacao
# =====================================================================
# Emissor do token (deve bater com o valor em Jwt.issuer(...))
mp.jwt.verify.issuer=mercado-api

# Chave simetrica HMAC-SHA256 para assinar/verificar tokens (Base64)
# ATENCAO: Gere uma chave segura para producao com: openssl rand -base64 64
# Em producao prefira RSA com smallrye.jwt.sign.key.location + mp.jwt.verify.publickey.location
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem

# Tempo de expiracao padrao configurado no UseCase (8h). Aqui apenas referencia.
# smallrye.jwt.new-token.lifespan=28800

# Politica de seguranca: deny-by-default exige @PermitAll ou @Authenticated explicitamente
quarkus.http.auth.permission.health.paths=/api/health,/health
quarkus.http.auth.permission.health.policy=permit
quarkus.http.auth.permission.default.paths=/*
quarkus.http.auth.permission.default.policy=permit
